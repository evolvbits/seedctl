# Cargo configuration for native and cross-platform SeedCTL builds.
#
# This file intentionally does not set `build.target`: each OS should build
# natively by default. Use the aliases below when producing release artifacts
# for a specific target triple.

[build]
target-dir = "target"

[alias]
check-workspace = "check --workspace --all-targets"
test-workspace = "test --workspace --lib"
build-linux-x86_64 = "build --release --target x86_64-unknown-linux-gnu"
build-macos-x86_64 = "build --release --target x86_64-apple-darwin"
build-macos-aarch64 = "build --release --target aarch64-apple-darwin"
build-windows-x86_64 = "build --release --target x86_64-pc-windows-msvc"
