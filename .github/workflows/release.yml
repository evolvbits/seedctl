name: Build and Release (Linux, macOS & Windows)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
            binary_name: seedctl
            dist_name: seedctl-linux-x86_64
          - os: macos-26
            target: aarch64-apple-darwin
            artifact_suffix: macos-aarch64
            binary_name: seedctl
            dist_name: seedctl-macos-aarch64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64
            binary_name: seedctl
            dist_name: seedctl-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64
            binary_name: seedctl.exe
            dist_name: seedctl-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Get version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(cargo pkgid -p seedctl | sed 's/.*#//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y wget xz-utils file

          # Download appimagetool (no FUSE required)
          wget -O appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          mv squashfs-root appimagetool

          # Prepare AppDir
          cp -r .github/AppImage AppDir-build
          mkdir -p AppDir-build/usr/bin
      
          strip target/${{ matrix.target }}/release/seedctl || true
          cp target/${{ matrix.target }}/release/seedctl AppDir-build/usr/bin/seedctl

          # Build AppImage
          mkdir -p dist
          ./appimagetool/AppRun AppDir-build dist/seedctl-${{ steps.version.outputs.version }}-linux-x86_64.AppImage

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
             "dist/seedctl-${{ steps.version.outputs.version }}-${{ matrix.dist_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_suffix }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(cargo pkgid -p seedctl | sed 's/.*#//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      # SHA256SUMS
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      # GPG SIGNING
      - name: Import GPG private key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        env:
          GPG_TTY: /dev/tty

      - name: Sign SHA256SUMS
        run: |
          cd dist
          echo "${{ secrets.GPG_PASSPHRASE }}" | \
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --armor --detach-sign SHA256SUMS

      # GITHUB RELEASE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Version ${{ steps.version.outputs.version }}
          body: |
            Automatic release generated from Cargo.toml.

            Version: ${{ steps.version.outputs.version }}

            🔐 Files included:
            - Linux, macOS & Windows binaries
            - SHA256SUMS
            - GPG signature (SHA256SUMS.asc)

            ⚠️ Use only in a secure and offline environment.
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
