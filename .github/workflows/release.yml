name: Build and Release (Linux, macOS & Windows)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GIT_CLIFF_VERSION: "2.13.1"

jobs:
  build:
    name: Build ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cargo_alias: release-linux-x86_64
            artifact_suffix: linux-x86_64
            binary_name: seedctl
            dist_name: seedctl-linux-x86_64
          - os: macos-26
            target: aarch64-apple-darwin
            cargo_alias: release-macos-aarch64
            artifact_suffix: macos-aarch64
            binary_name: seedctl
            dist_name: seedctl-macos-aarch64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            cargo_alias: release-macos-x86_64
            artifact_suffix: macos-x86_64
            binary_name: seedctl
            dist_name: seedctl-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cargo_alias: release-windows-x86_64
            artifact_suffix: windows-x86_64
            binary_name: seedctl.exe
            dist_name: seedctl-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          targets: ${{ matrix.target }}

      - name: Get version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(cargo pkgid -p seedctl | sed 's/.*#//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo ${{ matrix.cargo_alias }}

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y wget xz-utils file

          # Download appimagetool (no FUSE required)
          wget -O appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          mv squashfs-root appimagetool

          # Prepare AppDir
          cp -r .github/AppImage AppDir-build
          mkdir -p AppDir-build/usr/bin
      
          strip target/${{ matrix.target }}/release/seedctl || true
          cp target/${{ matrix.target }}/release/seedctl AppDir-build/usr/bin/seedctl

          # Build AppImage
          mkdir -p dist
          ./appimagetool/AppRun AppDir-build dist/seedctl-${{ steps.version.outputs.version }}-linux-x86_64.AppImage

      - name: Prepare binary artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
             "dist/seedctl-${{ steps.version.outputs.version }}-${{ matrix.dist_name }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_suffix }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - name: Install git-cliff
        run: cargo install git-cliff --locked --version "$GIT_CLIFF_VERSION"

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(cargo pkgid -p seedctl | sed 's/.*#//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          git fetch --force --tags
          git cliff --config cliff.toml --current --strip header --output RELEASE_NOTES.md
          perl -0pi -e 's/\n{3,}/\n\n/g; s/\s+\z/\n/' RELEASE_NOTES.md
          if ! grep -q '^- ' RELEASE_NOTES.md; then
            printf 'No notable conventional changes for this release.\n' > RELEASE_NOTES.md
          fi

      - name: Update CHANGELOG.md on default branch
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/${DEFAULT_BRANCH}"
          git cliff --config cliff.toml --output CHANGELOG.md
          perl -0pi -e 's/\n{3,}/\n\n/g; s/\s+\z/\n/' CHANGELOG.md

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: update changelog for ${{ github.ref_name }} [skip ci]"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binaries-*
          merge-multiple: true

      # SHA256SUMS
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      # GPG SIGNING
      - name: Import GPG private key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        env:
          GPG_TTY: /dev/tty

      - name: Sign SHA256SUMS
        run: |
          cd dist
          echo "${{ secrets.GPG_PASSPHRASE }}" | \
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 \
              --armor --detach-sign SHA256SUMS

      # GITHUB RELEASE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Version ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
